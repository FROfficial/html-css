<!DOCTYPE html>
<html>
  <head>
    <title>Youtube</title>
    <link rel="stylesheet" href="recreate-yt.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <input type="text" name="searchbar" id="searchbar" class="searchbar" placeholder="Search">
    <div class="video-preview">
      <div>
        <img class="thumbnail" src="thumbnails/hq720.avif">
      </div>
      <div>
        <div class="video-channel-pfp">
          <img src="channel-pfp/super-simple-dev-pfp.jpg">
        </div>
        <div class="video-information">
          <p class="video-title">HTML & CSS Full Course - Beginner to Pro</p>
          <p class="video-author">SuperSimpleDev</p>
          <p class="video-stats">19M views &#183; 4 years ago</p>
        </div>
      </div>
    </div>
    <div class="video-preview">
      <div>
        <img class="thumbnail" src="thumbnails/hq721.avif">
      </div>
      <div>
        <div class="video-channel-pfp">
          <img src="channel-pfp/bass-nation-pfp.jpg">
        </div>
        <div class="video-information">
          <p class="video-title">Cresce & Holly - Too Much</p>
          <p class="video-author">Bass Nation</p>
          <p class="video-stats">278K views &#183; 10 years ago</p>
        </div>
      </div>
    </div>
  </body>
</html>
