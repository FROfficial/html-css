<!DOCTYPE html>
<html>
    <head>
        <title>Div Examples</title>
        <style>
            .green-box {
                background-color: green;
                height: 50px;
                width: 50px;
                margin: 10px;
            }
            .red-circle {
                background-color: red;
                border-radius: 30px;
                height: 50px;
                width: 50px;
                margin: 10px;
            }
            .wrapped-contents {
                border: solid;
                border-width: 1px;
                border-color: grey;
                width: 300px;
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <div class="green-box"></div>
        <div class="red-circle"></div>
        <div class="wrapped-contents">
            <p>Satisfied with our service?</p>
            <button>Yes</button>
            <button>No</button>
        </div>
    </body>
</html>
