<!DOCTYPE>
<html>
    <head>
        <title>Flexbox</title>
        <style></style>
    </head>
    <body>
        <div style="
        display: flex;
        flex-direction: row;">
            <div style="background-color: lightblue;">1</div>
            <div style="background-color: lightpink;">2</div>
        </div>
        <div style="
        margin-top: 30px;
        display: flex;
        flex-direction: row;">
            <div style="background-color: lightblue; width: 100px;">100px</div>
            <div style="background-color: lightpink; flex: 1">flex 1</div>
        </div>
        <div style="
        margin-top: 30px;
        display: flex;
        flex-direction: row;">
            <div style="background-color: lightblue; width: 100px;">100px</div>
            <div style="background-color: lightpink; flex: 1">flex - 1</div>
            <div style="background-color: lightgreen; flex: 2">flex - 2</div>
        </div>
        <div style="
        height: 70px;
        border-width: 1px;
        border-style: solid;
        border-color:grey;
        margin-top: 30px;
        display: flex;
        flex-direction: row;
        justify-content: center;">
            <div style="background-color: lightblue; width: 100px;">100px</div>
            <div style="background-color: lightpink; width: 100px;">100px</div>
            <div style="background-color: lightgreen; width: 100px;">100px</div>
        </div>
        <div style="
        height: 70px;
        border-width: 1px;
        border-style: solid;
        border-color:grey;
        margin-top: 30px;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;">
            <div style="background-color: lightblue; width: 100px;">100px</div>
            <div style="background-color: lightpink; width: 100px;">100px</div>
            <div style="background-color: lightgreen; width: 100px;">100px</div>
        </div>
    </body>
</html>
