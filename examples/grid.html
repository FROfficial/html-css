<!DOCTYPE html>
<html>
  <head>
    <title>Grid Practice</title>
  </head>
  <body style="padding-bottom: 1000px;">
    <div style="
    display: grid;
    grid-template-columns: 100px 100px;
    ">
      <div style="background-color: lightblue;">div 1</div>
      <div style="background-color: lightpink;">div 2</div>
    </div>
    <div style="
    margin-top: 30px;
    display: grid;
    grid-template-columns: 100px 100px 200px;
    ">
      <div style="background-color: lightblue;">100px</div>
      <div style="background-color: lightpink;">100px</div>
      <div style="background-color: lightgreen;">200px</div>
      <div style="background-color: lightpink;">div 4</div>
    </div>
    <div style="
    margin-top: 30px;
    display: grid;
    grid-template-columns: 100px 1fr;
    ">
      <div style="background-color: lightblue;">100px</div>
      <div style="background-color: lightpink;">1 fr</div>
    </div>
    <div style="
    margin-top: 30px;
    display: grid;
    grid-template-columns: 100px 1fr 1fr;
    ">
      <div style="background-color: lightblue;">100px</div>
      <div style="background-color: lightpink;">1 fr</div>
      <div style="background-color: lightgreen;">1 fr</div>
    </div>
    <div style="
    margin-top: 30px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    column-gap: 20px;
    row-gap: 20px;
    ">
      <div style="background-color: lightblue; height: 200px;">1 fr</div>
      <div style="background-color: lightpink; height: 200px;">1 fr</div>
      <div style="background-color: lightgreen; height: 200px;">1 fr</div>
      <div style="background-color: lightblue; height: 200px;">1 fr</div>
      <div style="background-color: lightpink; height: 200px;">1 fr</div>
      <div style="background-color: lightgreen; height: 200px;">1 fr</div>
      <div style="background-color: lightblue; height: 200px;">1 fr</div>
      <div style="background-color: lightpink; height: 200px;">1 fr</div>
      <div style="background-color: lightgreen; height: 200px;">1 fr</div>
    </div>

    <div> Examples
      <div style="
      margin-top: 30px;
      display: grid;
      grid-template-columns: 200px 75px;
      ">
        <div style="background-color: lightblue;">1</div>
        <div style="background-color: lightpink;">2</div>
      </div>
    </div>
    <div style="
    margin-top: 30px;
    display: grid;
    grid-template-columns: 50px 1fr 75px;">
      <div style="background-color: lightblue;">1</div>
      <div style="background-color: lightpink;">2</div>
      <div style="background-color: lightgreen;">3</div>
    </div>
    <div style="
    margin-top: 30px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    column-gap: 20px;
    row-gap: 10px;"
    >
      <div style="background-color: lightblue;">1</div>
      <div style="background-color: lightpink;">2</div>
      <div style="background-color: lightgreen;">3</div>
      <div style="background-color: lightgrey;">4</div>
      <div style="background-color: lightblue;">1</div>
      <div style="background-color: lightpink;">2</div>
      <div style="background-color: lightgreen;">3</div>
      <div style="background-color: lightgrey;">4</div>
      <div style="background-color: lightblue;">1</div>
      <div style="background-color: lightpink;">2</div>
      <div style="background-color: lightgreen;">3</div>
      <div style="background-color: lightgrey;">4</div>

    </div>
  </body>
</html>
