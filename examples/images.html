<!DOCTYPE html>
<html>
    <head>
        <title>Images Practice</title>
        <style>
            .cat-style-1 {
                width: 200px;
                border-radius: 10px;
            }
            .cat-style-2 {
                width: 150px;
                height: 150px;
                object-fit: cover;
                object-position: center;
            }
            .cat-style-3 {
                width: 150px;
                height: 150px;
                object-fit: cover;
                object-position: center;
                border-radius: 75px;
            }
        </style>
    </head>
    <body>
        <img class="cat-style-1" src="portrait-of-a-young-black-cat.webp">
        <img class="cat-style-2" src="portrait-of-a-young-black-cat.webp">
        <img class="cat-style-3" src="portrait-of-a-young-black-cat.webp">
    </body>
</html>
