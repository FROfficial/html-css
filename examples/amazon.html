<!DOCTYPE html>
<style>
  .back {
    color: rgb(0,113,133);
  }
  .price {
    color: rgb(0, 118, 0);
    font-weight: bold;
  }
  .cart-button {
    border: none;
    cursor: pointer;
    background-color: rgb(255,216,20);
    width: 150px;
    height: 36px;
    border-radius: 30px;
    margin: 0 5 0 5;
    transition: background-color .2s;
    
  }
  .cart-button:hover {
    background-color: rgb(192, 162, 14);
  }
  .cart-button:active {
    opacity: .8;
  }
  .buy-button {
    border: none;
    cursor: pointer;
    background-color: rgb(255,164,28);
    width: 150px;
    height: 36px;
    border-radius: 30px;
    margin: 0 5 0 5;
    transition: background-color .2s;
  }
  .buy-button:hover {
    background-color: rgb(210, 135, 23);
  }
  .buy-button:active {
    opacity: .8;
  }
</style>
<body>
  <a href="https://www.amazon.com/" target="_blank">Back to Amazon</a>
  <h1>Nike Black Running Shoes</h1>
  <p class="price">$39 - in stock.</p>
  <p>Free delivery tomorrow.</p>
  <button class="cart-button">Add to Cart</button>
  <button class="buy-button">Buy Now</button>
</body>
