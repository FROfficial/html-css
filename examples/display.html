<!DOCTYPE html>
<html>
    <head>
        <title>Display Block and Inline-Block Examples</title>
        <style>
            .block-text-input {
                display: block;
                margin: 5px;
            }
            .inline-paragraph {
                width: 200px;
                display: inline-block;
                vertical-align: middle;
            }
            img {
                width: 300px;
                display: block;
                margin: auto;
            }
            .search {
                height: 30px;
                width: 40vw;
                display: block;
                margin: auto;
                border-radius: 30px;
                padding: 0px 10px;
                border: none;
                box-shadow: 1px 1px 5px grey;
            }
        </style>
    </head>
    <body>
        <input type="text" placeholder="Name" class="block-text-input">
        <input type="text" placeholder="Email" class="block-text-input">
        <br>
        <p class="inline-paragraph">Thanks for chatting with our customer support. Would you like to tkae our quick survey?</p>
        <button>Yes</button>
        <button>No</button>
        <br>
        <img src="Google-Logo-500x281.webp">
        <input type="text" placeholder="Search Google or type a URL" class="search">
    </body>
</html>
